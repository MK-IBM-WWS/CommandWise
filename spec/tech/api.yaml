openapi: 3.0.3
info:
  title: Linux Command RAG — внешний Go API
  version: 1.0.0
  description: API CommandWise. Контракт SSE и жизненный цикл задания описаны в api-behavior.md.
servers:
- url: http://127.0.0.1:8080
security:
- SessionJWT: []
- BearerJWT: []
paths:
  /api/v1/corpus:
    get:
      operationId: getCorpus
      summary: Доступный проверенный корпус
      security: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusInfo'
        '503':
          description: Поиск/индекс недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/chats:
    get:
      operationId: listChats
      summary: Чаты текущего пользователя
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatList'
        '503':
          description: База недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createChat
      summary: Новый чат с фиксированным target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChat'
            example:
              distribution: debian
              release: '13'
              title: Новый чат
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Невалидный JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Target не входит в проверенный corpus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Зависимость недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Достигнут лимит из десяти чатов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/chats/{chat_id}/messages:
    parameters: &id002
    - &id003
      name: chat_id
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
    get:
      operationId: listMessages
      summary: История собственного чата
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '404':
          description: Чат отсутствует или чужой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: sendMessage
      summary: Поставить вопрос в очередь и опционально подписаться на поток
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
            example:
              content: Как найти обычные файлы больше 100 МиБ?
              stream: true
              client_request_id: b2d1f497-03d1-4ef6-980c-530b46fbc962
      responses:
        '200':
          description: 'SSE: status, sources, token, done или error'
          content:
            text/event-stream:
              schema: &id007
                type: string
        '400':
          description: Невалидный вопрос/JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Чат отсутствует или чужой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: REQUEST_EXISTS с message_id либо CHAT_BUSY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Очередь заполнена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Поиск или модель недоступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '202':
          description: Задание принято при stream=false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /api/v1/chats/{chat_id}/messages/{message_id}/sources/{chunk_id}:
    parameters:
    - name: chat_id
      in: path
      required: true
      schema: *id001
    - name: message_id
      in: path
      required: true
      schema: *id001
    - name: chunk_id
      in: path
      required: true
      schema: &id004
        type: string
    get:
      operationId: getSourceSnapshot
      summary: Snapshot источника конкретного собственного ответа
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSnapshot'
        '404':
          description: Объект отсутствует или чужой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Процесс жив; без сессии и без генерации
      security: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/ready:
    get:
      operationId: getReady
      summary: БД, индекс и подготовленная модель доступны; без полной генерации
      security: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: Не готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Сессия выдана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Слишком много попыток
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Логин занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - in: header
        name: X-Auth-Mode
        required: false
        schema:
          type: string
          enum:
          - bearer
        description: Запросить JWT в JSON. По умолчанию сервер устанавливает HttpOnly-cookie.
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Сессия выдана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Слишком много попыток
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - in: header
        name: X-Auth-Mode
        required: false
        schema:
          type: string
          enum:
          - bearer
        description: Запросить JWT в JSON. По умолчанию сервер устанавливает HttpOnly-cookie.
  /api/v1/auth/me:
    get:
      operationId: getAccount
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Выход
        '401':
          description: Требуется вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/chats/{chat_id}:
    parameters: *id002
    delete:
      operationId: deleteChat
      responses:
        '204':
          description: Чат удалён
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Сначала остановите задание
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/chats/{chat_id}/messages/{message_id}/cancel:
    parameters:
    - *id003
    - name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: cancelGeneration
      responses:
        '204':
          description: Остановка запрошена или задание уже завершено
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/documents:
    get:
      operationId: listRagDocuments
      responses:
        '200':
          description: Документы корпуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagDocuments'
        '403':
          description: Нужна роль администратора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: uploadRagDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RagUpload'
      responses:
        '201':
          description: Индекс опубликован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagPublished'
        '400':
          description: Файл не принят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Нужна роль администратора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Идентификатор занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Метаданные или Markdown не прошли проверку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Индекс недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Файл слишком велик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    SessionJWT:
      type: apiKey
      in: cookie
      name: cw_session
      description: JWT в HttpOnly-cookie
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Target:
      type: object
      properties:
        distribution: &id005
          type: string
          enum:
          - debian
          - ubuntu
          - fedora
          - arch
        release: &id006
          type: string
          minLength: 1
      required:
      - distribution
      - release
      additionalProperties: false
    Release:
      type: object
      properties:
        id: *id004
        label: *id004
      required:
      - id
      - label
      additionalProperties: false
    Distribution:
      type: object
      properties:
        id: *id004
        label: *id004
        releases:
          type: array
          items:
            $ref: '#/components/schemas/Release'
      required:
      - id
      - label
      - releases
      additionalProperties: false
    CorpusInfo:
      type: object
      properties:
        corpus_version: *id004
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/Distribution'
      required:
      - corpus_version
      - distributions
      additionalProperties: false
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id004
            message: *id004
            message_id: *id001
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
      required:
      - status
      additionalProperties: false
    Ready:
      type: object
      properties:
        status:
          type: string
          enum:
          - ready
        corpus_version: *id004
      required:
      - status
      - corpus_version
      additionalProperties: false
    CreateChat:
      type: object
      properties:
        distribution: *id005
        release: *id006
        title:
          type: string
          maxLength: 120
          default: Новый чат
      required:
      - distribution
      - release
      additionalProperties: false
    Chat:
      type: object
      properties:
        id: *id001
        distribution: *id005
        release: *id004
        title: *id004
        created_at: &id008
          type: string
          format: date-time
        status:
          type: string
          enum:
          - idle
          - queued
          - generating
      required:
      - id
      - distribution
      - release
      - title
      - status
      - created_at
      additionalProperties: false
    SourceCard:
      type: object
      properties:
        ref:
          type: integer
          minimum: 1
        chunk_id: *id004
        document_id: *id004
        title: *id004
        source_url:
          type: string
          format: uri
        distribution: *id004
        release: *id004
        section: *id007
      required:
      - ref
      - chunk_id
      - document_id
      - title
      - source_url
      - distribution
      - release
      additionalProperties: false
    SourceSnapshot:
      type: object
      properties:
        ref:
          type: integer
          minimum: 1
        chunk_id: *id004
        document_id: *id004
        title: *id004
        source_url:
          type: string
          format: uri
        distribution: *id004
        release: *id004
        text: *id004
        command: *id004
        section: *id004
        package_version: *id004
        corpus_version: *id004
        collected_at: *id007
      required:
      - ref
      - chunk_id
      - document_id
      - title
      - source_url
      - distribution
      - release
      - text
      - command
      - section
      - package_version
      - corpus_version
      additionalProperties: false
    Message:
      type: object
      properties:
        id: *id001
        role:
          type: string
          enum:
          - user
          - assistant
        content: *id004
        status:
          type: string
          enum:
          - queued
          - complete
          - generating
          - cancelled
          - error
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceCard'
        created_at: *id008
        error: *id007
        finish_reason: *id007
        corpus_version: *id007
      required:
      - id
      - role
      - content
      - status
      - sources
      - created_at
      additionalProperties: false
    SendMessage:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
        stream:
          type: boolean
          default: false
        client_request_id: *id001
      required:
      - content
      - client_request_id
      additionalProperties: false
    ChatList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Chat'
      required:
      - items
      additionalProperties: false
    MessageList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
      required:
      - items
      additionalProperties: false
    SseSources:
      type: object
      properties:
        message_id: *id001
        corpus_version: *id004
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceCard'
      required:
      - message_id
      - corpus_version
      - sources
      additionalProperties: false
    SseToken:
      type: object
      properties:
        delta: *id004
      required:
      - delta
      additionalProperties: false
    SseDone:
      type: object
      properties:
        message_id: *id001
        finish_reason:
          type: string
          enum:
          - stop
          - no_context
          - length
          - cancelled
      required:
      - message_id
      - finish_reason
      additionalProperties: false
    SseError:
      type: object
      properties:
        code: *id004
        message: *id004
      required:
      - code
      - message
      additionalProperties: false
    Credentials:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 8
          description: Максимум 72 байта UTF-8.
    Account:
      type: object
      required:
      - id
      - login
      - role
      properties:
        id:
          type: string
          format: uuid
        login: *id007
        role:
          type: string
          enum:
          - user
          - admin
    AuthResult:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/Account'
        token:
          type: string
          description: 'Выдаётся при X-Auth-Mode: bearer.'
    RagUpload:
      type: object
      required:
      - document_id
      - package
      - package_version
      - source_url
      - collected_at
      - distribution
      - release
      - file
      properties:
        document_id: *id007
        package: *id007
        package_version: *id007
        source_url: *id007
        collected_at: *id007
        distribution: *id007
        release: *id007
        file:
          type: string
          format: binary
          description: 'Markdown UTF-8, до 512 КиБ, с разделами ## или ###.'
    RagDocument:
      type: object
      required:
      - document_id
      - package
      - package_version
      - source_url
      - verified_targets
      properties:
        document_id: *id007
        package: *id007
        package_version: *id007
        source_url: *id007
        collected_at: *id007
        verified_targets:
          type: array
          items:
            $ref: '#/components/schemas/Target'
    RagDocuments:
      type: object
      required:
      - corpus_version
      - items
      properties:
        corpus_version: *id007
        items:
          type: array
          items:
            $ref: '#/components/schemas/RagDocument'
    RagPublished:
      type: object
      required:
      - corpus_version
      - document_id
      properties:
        corpus_version: *id007
        document_id: *id007
    SseStatus:
      type: object
      required:
      - message_id
      - status
      properties:
        message_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - generating
