openapi: 3.0.3
info:
  title: Linux Command RAG — внутренний BM25 API
  version: 0.1.0
  description: Проект контракта CPU search, без LLM. Фильтр target применяется до top-k. Реализация запланирована;
    empty items — no context, не ошибка сервиса.
servers:
- url: http://search:8000
  description: Будущий адрес внутри Compose
paths:
  /v1/search:
    post:
      operationId: searchChunks
      summary: Совместимые фрагменты документации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              query: Как найти обычные файлы больше 100 МиБ?
              distribution: debian
              release: '13'
              top_k: 5
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '422':
          description: Невалидный запрос или unsupported target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Индекс не готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/corpus:
    get:
      operationId: getSearchCorpus
      summary: Metadata проверенного corpus
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusInfo'
        '503':
          description: Индекс недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /health:
    get:
      operationId: searchHealth
      security: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      operationId: searchReady
      security: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: Индекс не прошёл загрузку/валидацию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    Target:
      type: object
      properties:
        distribution: &id002
          type: string
          enum:
          - debian
          - ubuntu
          - fedora
          - arch
        release: &id003
          type: string
          minLength: 1
      required:
      - distribution
      - release
      additionalProperties: false
    Release:
      type: object
      properties:
        id: &id001
          type: string
        label: *id001
      required:
      - id
      - label
      additionalProperties: false
    Distribution:
      type: object
      properties:
        id: *id001
        label: *id001
        releases:
          type: array
          items:
            $ref: '#/components/schemas/Release'
      required:
      - id
      - label
      - releases
      additionalProperties: false
    CorpusInfo:
      type: object
      properties:
        corpus_version: *id001
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/Distribution'
      required:
      - corpus_version
      - distributions
      additionalProperties: false
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id001
            message: *id001
            message_id:
              type: string
              format: uuid
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
      required:
      - status
      additionalProperties: false
    Ready:
      type: object
      properties:
        status:
          type: string
          enum:
          - ready
        corpus_version: *id001
      required:
      - status
      - corpus_version
      additionalProperties: false
    SearchRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
        distribution: *id002
        release: *id003
        top_k:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
      required:
      - query
      - distribution
      - release
      - top_k
      additionalProperties: false
    Chunk:
      type: object
      properties:
        chunk_id: *id001
        document_id: *id001
        command: *id001
        title: *id001
        text: *id001
        source_url:
          type: string
          format: uri
        score:
          type: number
          format: double
          description: BM25 score, не вероятность; значение может быть <= 0
        distribution:
          type: string
          enum:
          - common
          - debian
          - ubuntu
          - fedora
          - arch
        release: *id001
        package_version: *id001
        section: *id001
        collected_at:
          type: string
          format: date-time
        applies_to:
          type: array
          items:
            $ref: '#/components/schemas/Target'
      required:
      - chunk_id
      - document_id
      - command
      - title
      - text
      - source_url
      - score
      - distribution
      - release
      - package_version
      - section
      additionalProperties: false
    SearchResult:
      type: object
      properties:
        corpus_version: *id001
        items:
          type: array
          items:
            $ref: '#/components/schemas/Chunk'
      required:
      - corpus_version
      - items
      additionalProperties: false
