openapi: 3.0.3
info:
  title: Linux Command RAG — внутренний BM25 API
  version: 0.1.0
  description: Проект контракта CPU search, без LLM. Фильтр target применяется до top-k. Реализация запланирована;
    empty items — no context, не ошибка сервиса.
servers:
- url: http://search:8000
  description: Будущий адрес внутри Compose
paths:
  /v1/search:
    post:
      operationId: searchChunks
      summary: Совместимые фрагменты документации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            example:
              query: Как найти обычные файлы больше 100 МиБ?
              distribution: debian
              top_k: 5
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '422':
          description: Невалидный запрос или unsupported target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Индекс не готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/corpus:
    get:
      operationId: getSearchCorpus
      summary: Metadata проверенного corpus
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusInfo'
        '503':
          description: Индекс недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /health:
    get:
      operationId: searchHealth
      security: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      operationId: searchReady
      security: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: Индекс не прошёл загрузку/валидацию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/admin/documents:
    get:
      operationId: getIndexDocuments
      summary: Метаданные опубликованного снимка корпуса
      responses:
        '200':
          description: Версия и массив документов
        '503':
          description: Индекс недоступен
    post:
      operationId: publishIndexDocument
      summary: Добавить документ и опубликовать снимок корпуса
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - document_id
              - package
              - package_version
              - source_url
              - collected_at
              - distribution
              properties:
                file:
                  type: string
                  format: binary
                document_id:
                  type: string
                package:
                  type: string
                package_version:
                  type: string
                source_url:
                  type: string
                collected_at:
                  type: string
                distribution:
                  type: string
      responses:
        '201':
          description: Версия опубликована
        '400':
          description: Невалидная форма
        '409':
          description: Идентификатор занят
        '413':
          description: Файл превышает 512 КиБ
        '422':
          description: Невалидные метаданные или Markdown
        '503':
          description: Публикация не завершилась
components:
  schemas:
    Target:
      type: object
      properties:
        distribution:
          type: string
          enum: &id001
          - debian
          - fedora
          - arch
      required:
      - distribution
      additionalProperties: false
    Distribution:
      type: object
      properties:
        id:
          type: string
          enum: *id001
        label: &id002
          type: string
      required:
      - id
      - label
      additionalProperties: false
    CorpusInfo:
      type: object
      properties:
        corpus_version: *id002
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/Distribution'
      required:
      - corpus_version
      - distributions
      additionalProperties: false
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id002
            message: *id002
            message_id:
              type: string
              format: uuid
          required:
          - code
          - message
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
      required:
      - status
      additionalProperties: false
    Ready:
      type: object
      properties:
        status:
          type: string
          enum:
          - ready
        corpus_version: *id002
      required:
      - status
      - corpus_version
      additionalProperties: false
    SearchRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
        distribution:
          type: string
          enum: *id001
        top_k:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        release:
          type: string
          deprecated: true
          description: Поле старого клиента, игнорируется.
      required:
      - query
      - distribution
      - top_k
      additionalProperties: false
    Chunk:
      type: object
      properties:
        chunk_id: *id002
        document_id: *id002
        command: *id002
        title: *id002
        text: *id002
        source_url:
          type: string
          format: uri
        score:
          type: number
          format: double
          description: BM25 score, не вероятность; значение может быть <= 0
        distribution:
          type: string
          enum:
          - common
          - debian
          - fedora
          - arch
        package_version: *id002
        section: *id002
        collected_at:
          type: string
          format: date
        applies_to:
          type: array
          items:
            $ref: '#/components/schemas/Target'
      required:
      - chunk_id
      - document_id
      - command
      - title
      - text
      - source_url
      - score
      - distribution
      - package_version
      - section
      additionalProperties: false
    SearchResult:
      type: object
      properties:
        corpus_version: *id002
        items:
          type: array
          items:
            $ref: '#/components/schemas/Chunk'
      required:
      - corpus_version
      - items
      additionalProperties: false
