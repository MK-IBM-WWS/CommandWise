<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommandWise</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="center">
<main class="card">
  <a class="back" href="chat.html">Назад в чат</a>
  <div class="ava big">И</div>
  <h1>Настройки аккаунта</h1>
  <p class="sub">Измените логин или пароль.</p>
  <form action="profile.html">
    <label class="field">Логин<input type="text" value="ivan_k" autocomplete="username"></label>
    <label class="field">Новый пароль<input type="password" placeholder="Введите новый пароль" autocomplete="new-password"></label>
    <label class="field">Повторите новый пароль<input type="password" placeholder="Ещё раз новый пароль" autocomplete="new-password"></label>
    <button class="btn" type="submit">Сохранить</button>
  </form>
</main>
</body>
</html>
