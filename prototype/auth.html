<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommandWise</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="center">
<input type="radio" name="tab" id="t-login" checked hidden>
<input type="radio" name="tab" id="t-reg" hidden>
<main class="card">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9fe0ff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient></defs><circle cx="16" cy="16" r="15" fill="url(#g)"/><path d="M16 7c1 5 3 7 8 9-5 2-7 4-8 9-1-5-3-7-8-9 5-2 7-4 8-9z" fill="#fff"/></svg>CommandWise</div>
  <h1>Добро пожаловать</h1>
  <p class="sub">Войдите, чтобы продолжить разговор с нейросетью.</p>
  <div class="tabs"><label for="t-login">Вход</label><label for="t-reg">Регистрация</label></div>

  <form class="f-login" action="chat.html">
    <label class="field">Логин<input type="text" placeholder="Ваш логин" autocomplete="username"></label>
    <label class="field">Пароль<input type="password" placeholder="Ваш пароль" autocomplete="current-password"></label>
    <button class="btn" type="submit">Войти</button>
  </form>

  <form class="f-reg" action="chat.html">
    <label class="field">Логин<input type="text" placeholder="Придумайте логин" autocomplete="username"></label>
    <label class="field">Пароль<input type="password" placeholder="Придумайте пароль" autocomplete="new-password"></label>
    <label class="field">Повторите пароль<input type="password" placeholder="Ещё раз пароль" autocomplete="new-password"></label>
    <button class="btn" type="submit">Создать аккаунт</button>
  </form>
</main>
</body>
</html>
